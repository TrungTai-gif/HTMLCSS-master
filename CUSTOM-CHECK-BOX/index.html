<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <label class="checkbox-lable" for="checkbox1">
        <input type="checkbox" name="tick" id="checkbox1">
        <div class="check-box">
            <img src="./image/checkbox.svg" alt="tick">
        </div>
    </label>

    <label class="radio-label" for="radio1">
        <input type="radio" name=" " id="radio1">
        <div class="radio">
            <img src="./image/checkbox.svg" alt="tick">
        </div>
    </label>

    <label class="toggle-label" for="toggle1">
        <input type="checkbox" name=" " id="toggle1">
        <div class="toggle">
            <div class="toggle-spinner"></div>
        </div>
    </label>

    <div class="day-by-day">
        <div class="day">Day by day</div>
        <ul class="list">
            <li>Timeline</li>
            <li>Calendar</li>
            <li>Maps</li>
        </ul>
    </div>

    <div class="input-div">
        <input type="text" class="input" placeholder=" ">
        <span class="span">Enter you email</span>
    </div>
</body>
</html>
